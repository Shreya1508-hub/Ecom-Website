<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meesho Homepage</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f8f8f8;
            color: #333;
        }


        .navbar {
            height: 70px;
            background-color: white;
            display: flex;
            align-items: center;
            padding: 0 60px;
            gap: 30px;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #9f2089;
        }

        .search-box {
            width: 450px;
            height: 42px;
            border: 1px solid #aaa;
            border-radius: 5px;
            display: flex;
            align-items: center;
            padding: 0 15px;
        }

        .search-box input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 15px;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            margin-left: auto;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-size: 14px;
        }
        .categories {
            background-color: white;
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 18px;
            border-bottom: 1px solid #ddd;
        }

        .categories a {
            text-decoration: none;
            color: #444;
            font-size: 14px;
        }

        .categories a:hover {
            color: #9f2089;
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">meesho</div>

        <div class="search-box">
            <input type="text" placeholder="Search for products, brands and more">
        </div>

        <div class="nav-links">
            <a href="#">Download App</a>
            <a href="#">Become a Supplier</a>
            <a href="#">Profile</a>
            <a href="#">Cart</a>
        </div>

    </nav>


    <div class="categories">
        <a href="#">Women Ethnic</a>
        <a href="#">Women Western</a>
        <a href="#">Men</a>
        <a href="#">Kids</a>
        <a href="#">Home & Kitchen</a>
        <a href="#">Beauty & Health</a>
        <a href="#">Jewellery</a>
        <a href="#">Bags & Footwear</a>
    </div>
</body>
</html>
